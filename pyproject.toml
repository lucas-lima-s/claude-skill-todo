[project]
name = "claude-skill-todo"
version = "1.0.0"
description = "Repository hygiene harness for the todo Claude Code skill"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
